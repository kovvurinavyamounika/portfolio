<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="title desc">
  <title id="title">C Programming badge</title>
  <desc id="desc">A teal C programming achievement badge with five stars.</desc>
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
  </defs>
  <rect width="420" height="300" rx="28" fill="#0f172a"/>
  <circle cx="210" cy="126" r="92" fill="url(#badge)" stroke="#5eead4" stroke-width="5"/>
  <circle cx="210" cy="126" r="70" fill="#0f172a" stroke="#99f6e4" stroke-opacity=".45" stroke-width="2"/>
  <text x="210" y="158" text-anchor="middle" fill="#ccfbf1" font-family="Georgia, serif" font-size="108" font-weight="700">C</text>
  <text x="210" y="46" text-anchor="middle" fill="#5eead4" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">C PROGRAMMING</text>
  <text x="210" y="250" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="25" letter-spacing="5">★★★★★</text>
  <text x="210" y="278" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">ACHIEVEMENT BADGE</text>
</svg>
